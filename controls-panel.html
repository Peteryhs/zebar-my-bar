<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      styles.css @imports the icon font stylesheet, which in turn asks for the
      woff2: three requests discovered one after another, with the icon glyphs
      not drawn until the last one lands. Preloading starts all three at once.
    -->
    <link rel="preload" href="./assets/nerdfonts.css" as="style" />
    <link rel="preload" href="./assets/nerdfont.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <!--
      The zebar client module and its dependencies are vendored (assets/vendor),
      for the same reason the icon font is: a panel is a fresh webview every time
      it opens, and importing the module graph from a CDN put three round trips
      in front of the first paint. Preloading them here starts all seven files at
      once instead of discovering each one after the previous has parsed.
    -->
    <link rel="modulepreload" href="./assets/vendor/zebar.js" />
    <link rel="modulepreload" href="./assets/vendor/zod.js" />
    <link rel="modulepreload" href="./assets/vendor/luxon.js" />
    <link rel="modulepreload" href="./assets/vendor/tauri-core.js" />
    <link rel="modulepreload" href="./assets/vendor/tauri-event.js" />
    <link rel="modulepreload" href="./assets/vendor/tauri-window.js" />
    <link rel="modulepreload" href="./assets/vendor/glazewm.js" />
  </head>
  <body class="panel-body">
    <div class="panel controls-panel">
      <div class="panel-header">
        <i class="nf nf-md-tune_variant"></i>
        <span class="panel-title">Volume and brightness</span>
      </div>

      <div class="control-block">
        <div class="control-row">
          <i class="nf nf-md-volume_high" id="volume-icon"></i>
          <span class="control-label">Volume</span>
          <span class="control-value" id="volume-value">--</span>
          <button class="control-button" id="mute" title="Mute or unmute">
            <i class="nf nf-md-volume_mute"></i>
          </button>
        </div>
        <input
          class="control-slider"
          id="volume-slider"
          type="range"
          min="0"
          max="100"
          step="1"
          value="0"
        />
        <div class="control-place" id="volume-device"></div>
      </div>

      <div class="control-block">
        <div class="control-row">
          <i class="nf nf-md-brightness_6" id="brightness-icon"></i>
          <span class="control-label">Brightness</span>
          <span class="control-value" id="brightness-value">--</span>
        </div>
        <input
          class="control-slider"
          id="brightness-slider"
          type="range"
          min="1"
          max="100"
          step="1"
          value="50"
        />
        <div class="control-place" id="brightness-note"></div>
      </div>
    </div>

    <script type="module">
      import * as zebar from './assets/vendor/zebar.js';

      const widget = zebar.currentWidget();

      const packDir = widget.htmlPath.replace(/[\\/][^\\/]*$/, '');
      const brightnessScript = `${packDir}\\scripts\\brightness.ps1`;

      const audio = zebar.createProvider({ type: 'audio' });

      const el = {
        icon: document.getElementById('volume-icon'),
        value: document.getElementById('volume-value'),
        slider: document.getElementById('volume-slider'),
        mute: document.getElementById('mute'),
        device: document.getElementById('volume-device'),
        brightnessIcon: document.getElementById('brightness-icon'),
        brightnessValue: document.getElementById('brightness-value'),
        brightnessSlider: document.getElementById('brightness-slider'),
        brightnessNote: document.getElementById('brightness-note'),
      };

      let device = null;
      let draggingVolume = false;

      function volumeIcon(volume, muted) {
        if (muted || volume === 0) return 'nf-md-volume_off';
        if (volume < 40) return 'nf-md-volume_low';
        if (volume < 70) return 'nf-md-volume_medium';
        return 'nf-md-volume_high';
      }

      function renderAudio() {
        if (!device) return;

        const volume = Math.round(device.volume);

        el.value.textContent = device.isMuted ? 'muted' : volume + '%';
        el.icon.className = 'nf ' + volumeIcon(volume, device.isMuted);
        el.mute.classList.toggle('active', device.isMuted);

        if (!draggingVolume) el.slider.value = String(volume);
      }

      audio.onOutput(output => {
        device = output.defaultPlaybackDevice;
        el.device.textContent = device ? device.name : 'no output device';
        renderAudio();
      });

      audio.onError(error => {
        el.device.textContent = 'Audio provider error: ' + JSON.stringify(error);
      });

      /*
       * Volume follows the slider while it is dragged, not on release. The call
       * goes straight into Zebar, so it is dispatched on every `input` event
       * without waiting for the previous one to come back: the newest value is
       * the only one that matters, and an in-flight call must not hold up the
       * pointer.
       */
      let volumeInFlight = false;
      let pendingVolume = null;

      async function pushVolume(volume) {
        if (!device) return;

        if (volumeInFlight) {
          pendingVolume = volume;
          return;
        }

        volumeInFlight = true;

        try {
          await audio.output.setVolume(volume, { deviceId: device.deviceId });
        } catch (error) {
          el.device.textContent = 'Failed: ' + (error?.message || error);
        } finally {
          volumeInFlight = false;
        }

        if (pendingVolume !== null) {
          const next = pendingVolume;
          pendingVolume = null;
          pushVolume(next);
        }
      }

      el.slider.addEventListener('input', () => {
        draggingVolume = true;
        const volume = Number(el.slider.value);

        // Draw first, so the readout tracks the pointer even if the call behind
        // it is slow.
        el.value.textContent = volume + '%';
        el.icon.className =
          'nf ' + volumeIcon(volume, device ? device.isMuted : false);

        pushVolume(volume);
      });

      el.slider.addEventListener('change', () => {
        draggingVolume = false;
      });

      el.mute.addEventListener('click', async () => {
        if (!device) return;

        try {
          await audio.output.setMute(!device.isMuted, {
            deviceId: device.deviceId,
          });
        } catch (error) {
          el.device.textContent = 'Failed: ' + (error?.message || error);
        }
      });

      /*
       * Brightness goes through one long lived PowerShell (brightness.ps1
       * -Action serve) instead of a process per step. Starting a process and
       * resolving the WMI classes cost a few hundred milliseconds each time,
       * which is what made the brightness slider lag behind the pointer while
       * the volume slider kept up. Here a step is a line on a pipe.
       */
      let brightnessServer = null;
      let draggingBrightness = false;
      let brightnessSupported = true;

      function markUnsupported() {
        brightnessSupported = false;
        el.brightnessValue.textContent = 'n/a';
        el.brightnessSlider.disabled = true;
        el.brightnessNote.textContent =
          'This panel has no software brightness control.';
      }

      function showBrightness(level) {
        el.brightnessValue.textContent = level + '%';
        el.brightnessNote.textContent = '';
        el.brightnessIcon.className =
          'nf ' + (level > 60 ? 'nf-md-brightness_7' : 'nf-md-brightness_5');

        if (!draggingBrightness) el.brightnessSlider.value = String(level);
      }

      async function startBrightnessServer() {
        const server = await zebar.shellSpawn('powershell.exe', [
          '-NoProfile',
          '-ExecutionPolicy',
          'Bypass',
          '-File',
          brightnessScript,
          '-Action',
          'serve',
        ]);

        server.onStdout(line => {
          const text = line.trim();

          if (text === 'unsupported') {
            markUnsupported();
            return;
          }

          // "set failed" and anything else non-numeric is ignored on purpose:
          // the slider is where the user is looking and it already shows the
          // value they asked for.
          const level = Number(text);
          if (Number.isFinite(level) && level >= 0) showBrightness(level);
        });

        server.onStderr(line => console.warn('brightness:', line));

        server.onExit(() => {
          brightnessServer = null;
        });

        brightnessServer = server;
      }

      /*
       * Fallback for when the server could not be started: one process per
       * change, coalesced so a drag cannot queue up a backlog.
       */
      let fallbackInFlight = false;
      let pendingFallback = null;

      async function pushBrightnessFallback(level) {
        if (fallbackInFlight) {
          pendingFallback = level;
          return;
        }

        fallbackInFlight = true;

        try {
          await zebar.shellExec('powershell.exe', [
            '-NoProfile',
            '-ExecutionPolicy',
            'Bypass',
            '-File',
            brightnessScript,
            '-Action',
            'set',
            '-Value',
            String(level),
          ]);
        } catch (error) {
          console.warn('brightness fallback failed:', error);
        } finally {
          fallbackInFlight = false;
        }

        if (pendingFallback !== null) {
          const next = pendingFallback;
          pendingFallback = null;
          pushBrightnessFallback(next);
        }
      }

      el.brightnessSlider.addEventListener('input', () => {
        if (!brightnessSupported) return;

        draggingBrightness = true;
        const level = Number(el.brightnessSlider.value);

        // Draw first, then send. The readout never waits on the panel hardware.
        el.brightnessValue.textContent = level + '%';
        el.brightnessIcon.className =
          'nf ' + (level > 60 ? 'nf-md-brightness_7' : 'nf-md-brightness_5');

        if (brightnessServer) {
          brightnessServer.write(level + '\n');
        } else {
          pushBrightnessFallback(level);
        }
      });

      el.brightnessSlider.addEventListener('change', () => {
        draggingBrightness = false;
      });

      startBrightnessServer().catch(error => {
        console.warn('brightness server failed to start:', error);
        el.brightnessNote.textContent = '';
      });

      /*
       * Shell first, close after: closing the widget destroys this page and its
       * JS context, so the server has to be told to go before that happens. It
       * also idles out on its own if this never runs.
       */
      window.addEventListener('beforeunload', () => {
        if (brightnessServer) brightnessServer.kill();
      });

      /* Closing is done from outside, by the helper the bar starts when it opens
         this panel (see window-ctl.ps1). Escape here is a bonus. */
      // Animate out first, then close: the window is transparent, so a short
      // fade and lift is visible before it disappears.
      function close() {
        const panel = document.querySelector('.panel');

        if (!panel || panel.classList.contains('closing')) {
          widget.close();
          return;
        }

        panel.classList.add('closing');
        setTimeout(() => widget.close(), 130);
      }

      window.addEventListener('keydown', event => {
        if (event.key === 'Escape') close();
      });
    </script>
  </body>
</html>
