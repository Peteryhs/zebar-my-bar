<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      styles.css @imports the icon font stylesheet, which in turn asks for the
      woff2: three requests discovered one after another, with the icon glyphs
      not drawn until the last one lands. Preloading starts all three at once.
    -->
    <link rel="preload" href="./assets/icons.css" as="style" />
    <link rel="preload" href="./assets/nerdfont.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" type="text/css" href="./styles.css" />

    <link rel="modulepreload" href="./assets/vendor/zebar.js" />
    <link rel="modulepreload" href="./assets/vendor/zod.js" />
    <link rel="modulepreload" href="./assets/vendor/luxon.js" />
    <link rel="modulepreload" href="./assets/vendor/tauri-core.js" />
    <link rel="modulepreload" href="./assets/vendor/tauri-event.js" />
    <link rel="modulepreload" href="./assets/vendor/tauri-window.js" />
    <link rel="modulepreload" href="./assets/vendor/glazewm.js" />
  </head>
  <body>
    <!--
      Written out here rather than built by a framework.
      
      This used to be React, compiled in the page by Babel, with all three of
      those fetched from a CDN along with the zebar client. It cost the bar its
      two worst failures. A network that was slow or unavailable left the bar
      completely blank, because nothing could run at all. And an await on one of
      those imports that never settled left the rest of the script unreached, so
      the panel guard was never started and nothing could dismiss a panel — which
      looked, from the outside, exactly like clicks needing to be repeated.
      
      A dozen readings do not need a framework, and the pack already vendors what
      it needs for the same reason: no widget should depend on a network to draw
      itself. Tiles are hidden until their provider has something to say.
    -->
    <div id="root">
      <div class="app">
        <div class="left">
          <i
            class="logo nf nf-dev-windows11 clickable"
            data-panel="windows-menu"
            title="Menu"
          ></i>

          <!-- Whatever application has the foreground, named the way a menu bar
               names it. Reported by the guard, which is watching the foreground
               window anyway. -->
          <span class="app-name clickable" data-panel="windows-menu" data-el="app-name" title="System menu" hidden></span>

          <div class="media clickable" data-panel="media-panel" hidden>
            <i class="nf" data-el="media-icon"></i>
            <span class="media-text" data-el="media-text"></span>
          </div>
          <button class="visualizer-toggle clickable" data-el="visualizer" type="button"
            aria-label="Turn off playback visualizer" aria-pressed="false" hidden
            title="Toggle playback visualizer (decorative animation)">
            <span class="equalizer" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b><b></b><b></b></span>
          </button>
          <div class="dino-widget" data-el="dinosaur" hidden>
            <button class="dino-start clickable" type="button" title="Pocket dinosaur: click to run">
              <svg class="dino-portrait" viewBox="0 0 16 14" aria-hidden="true"></svg><span>Run</span>
            </button>
            <div class="dino-run" hidden>
              <canvas class="dino-canvas" height="42" tabindex="0" role="application"
                aria-label="Full-bar dinosaur. Space or click jumps. Hold Down, S, or right mouse to duck. P pauses, Escape leaves."></canvas>
              <div class="dino-hud">
                <span class="dino-score" aria-hidden="true">000</span>
                <span class="dino-details">Lap 1</span>
                <span class="dino-help">Space jump · ↓ duck · P pause · Esc leave</span>
                <button class="dino-pause" type="button" title="Pause or resume game" aria-label="Pause game">Ⅱ</button>
                <button class="dino-exit" type="button" title="Leave game" aria-label="Leave game">×</button>
              </div>
            </div>
            <span class="sr-only dino-status" role="status" aria-live="polite"></span>
          </div>
        </div>

        <div class="center clickable" data-panel="calendar-panel" data-el="clock" title="Calendar"></div>

        <div class="right">
          <div
            class="volume clickable"
            data-panel="controls-panel"
            title="Volume and brightness"
            hidden
          >
            <i class="nf" data-el="volume-icon"></i>
            <span data-el="volume"></span>
          </div>

          <div class="system clickable" data-panel="system-panel" title="System panel" hidden>
            <span class="stat">
              <i class="nf nf-oct-cpu"></i>
              <span data-el="cpu"></span>
            </span>
            <span class="stat">
              <i class="nf nf-fae-chip"></i>
              <span data-el="memory"></span>
            </span>
          </div>

          <div class="storage clickable" data-panel="storage-panel" hidden>
            <i class="nf nf-md-harddisk"></i>
            <span data-el="storage"></span>
          </div>

          <div class="battery clickable" data-panel="battery-panel" title="Battery panel" hidden>
            <i class="nf" data-el="battery-icon"></i>
            <span data-el="battery"></span>
            <i class="nf nf-md-power_plug charging-icon" data-el="charging" hidden></i>
          </div>

          <div class="weather clickable" data-panel="weather-panel" hidden>
            <i class="nf" data-el="weather-icon"></i>
            <span data-el="weather"></span>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      import * as zebar from './assets/vendor/zebar.js';
      import { startWeather, weatherIcon } from './assets/weather.js';
      import { anchoredPlacement } from './assets/placement.js';
      import { onPreferences, setPreference } from './assets/preferences.js';

      const widget = zebar.currentWidget();
      const packDir = widget.htmlPath.replace(/[\\/][^\\/]*$/, '');
      const windowCtlScript = `${packDir}\\scripts\\window-ctl.ps1`;
      const brightnessScript = `${packDir}\\scripts\\brightness.ps1`;

      /*
       * The bar's console is not visible to anybody, and a guard that fails to
       * start leaves no trace of its own: the failure looks exactly like a bar
       * that never asked for one. This writes the reason into the same log the
       * guard writes, through the shell path that already closes panels.
       *
       * Never awaited, and allowed to fail: a diagnostic that can break the bar
       * is worse than the silence it replaces.
       */
      /*
       * One line in %TEMP%\zebar-window-ctl.log when the guard could not be
       * started. A guard that fails to start leaves no trace of its own - the
       * window helper is the thing that writes the log - so the failure used to
       * look exactly like a bar that never asked for one.
       *
       * Bypass is not optional here: this machine refuses unsigned scripts, and
       * without it PowerShell exits before running a single line.
       */
      function guardDiag(message) {
        try {
          zebar.shellExec('powershell.exe', [
            '-NoProfile',
            '-ExecutionPolicy',
            'Bypass',
            '-File',
            windowCtlScript,
            '-Action',
            'diag',
            '-Match',
            'diag',
            '-Message',
            String(message).replace(/["'\r\n]+/g, ' ').slice(0, 400),
          ]).catch(() => {});
        } catch (error) {
          // Nothing to do: the log is a convenience, not a requirement.
        }
      }

      // Every element the script writes to, looked up once.
      const el = {};
      for (const node of document.querySelectorAll('[data-el]')) {
        el[node.dataset.el] = node;
      }

      const tile = {};
      for (const node of document.querySelectorAll('[data-panel]')) {
        tile[node.dataset.panel] ||= node;
        node.setAttribute('role', 'button');
        node.tabIndex = 0;
        node.setAttribute('aria-haspopup', 'dialog');
        node.setAttribute('aria-expanded', 'false');
      }

      let visualizerEnabled = false;
      let mediaPlaying = false;
      let dinosaurEnabled = false;
      let dinosaur = null;
      let dinosaurLoading = null;
      function updateVisualizer() {
        show(el.visualizer, visualizerEnabled && mediaPlaying);
        setClassToggle(el.visualizer, 'is-playing', mediaPlaying);
      }
      onPreferences(preferences => {
        visualizerEnabled = preferences.visualizer;
        el.visualizer.setAttribute('aria-pressed', String(visualizerEnabled));
        document.body.classList.toggle('is-compact', preferences.compact);
        for (const key of ['showAppName', 'showSystem', 'showStorage', 'showWeather']) {
          document.body.classList.toggle('hide-' + key, !preferences[key]);
        }
        updateVisualizer();
        dinosaurEnabled = preferences.dinosaur;
        if (dinosaur) dinosaur.setEnabled(dinosaurEnabled);
        else if (dinosaurEnabled && !dinosaurLoading) {
          // No game code or animation loop until it is enabled in settings.
          dinosaurLoading = import('./assets/dinosaur.js').then(({ mountDinosaur }) => {
            dinosaur = mountDinosaur(el.dinosaur);
            dinosaur.setEnabled(dinosaurEnabled);
          }).catch(error => {
            dinosaurLoading = null;
            console.warn('Could not load Pocket dinosaur:', error);
          });
        }
      });
      el.visualizer.addEventListener('click', () => setPreference('visualizer', !visualizerEnabled));
      document.addEventListener('visibilitychange', () => {
        document.body.classList.toggle('is-hidden', document.hidden);
      });
      document.body.classList.toggle('is-hidden', document.hidden);

      function setText(node, text) {
        if (!node) return;
        const val = text ?? '';
        if (node.textContent !== val) node.textContent = val;
      }

      function setClass(node, className) {
        if (!node) return;
        const val = className ?? '';
        if (node.className !== val) node.className = val;
      }

      function setTitle(node, title) {
        if (!node) return;
        const val = title ?? '';
        if (node.title !== val) node.title = val;
      }

      function show(node, visible) {
        if (!node) return;
        const hidden = !visible;
        if (node.hidden !== hidden) node.hidden = hidden;
      }

      function setClassToggle(node, className, force) {
        if (!node) return;
        if (node.classList.contains(className) !== Boolean(force)) {
          node.classList.toggle(className, force);
        }
      }

      /* ------------------------------------------------------------------ *
       * Readings
       * ------------------------------------------------------------------ */

      const providers = zebar.createProviderGroup({
        cpu: { type: 'cpu' },
        battery: { type: 'battery', refreshInterval: 30000 },
        memory: { type: 'memory' },
        media: { type: 'media' },
        audio: { type: 'audio' },
        disk: { type: 'disk', refreshInterval: 60000 },
      });

      // The clock has minute precision. Update it at the minute boundary rather
      // than waking the whole provider group (and every tile) once per second.
      const clockFormat = new Intl.DateTimeFormat(undefined, {
        weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit',
      });
      let clockTimer;
      function updateClock() {
        clearTimeout(clockTimer);
        const now = new Date();
        setText(el.clock, clockFormat.format(now));
        setTitle(el.clock, now.toLocaleDateString(undefined, { dateStyle: 'full' }) + ' · Calendar');
        if (!document.hidden) clockTimer = setTimeout(updateClock, 60000 - (Date.now() % 60000) + 20);
      }
      document.addEventListener('visibilitychange', updateClock);
      updateClock();

      // Remembered while nothing is playing, so the tile still shows the last
      // thing that played instead of disappearing.
      let lastTrack = null;
      let isDraggingControl = false;

      // The battery provider is the one reading that blips. A failed driver
      // refresh is emitted as an error, zebar sets that provider's output to
      // null, and the next tick from any other provider re-renders with
      // `out.battery === null` - which used to hide the whole tile until the
      // next good battery read (a full refresh interval later). Keep the last
      // good reading, dim it while it is not live, and restart a provider that
      // has gone quiet for good.
      let lastBattery = null;
      let batteryRestartTimer = null;
      let batteryRetries = 0;

      /*
       * Battery state comes from WMI, and zebar refreshes it on the interval it
       * is given. Asking for it every couple of seconds was enough to make the
       * refresh fail on this machine: the provider then emits an error on every
       * tick, the tile keeps its last number, and it dims because nothing fresh
       * has arrived. Thirty seconds is still current for a battery, and three
       * missed polls is the point at which the number really is old.
       */
      const BATTERY_STALE_AFTER_MS = 90000;
      const BATTERY_RETRY_BASE_MS = 60000;
      const BATTERY_RETRY_MAX_MS = 300000;
      let lastBatteryAt = 0;

      function batteryIcon(percent) {
        if (percent > 90) return 'nf-fa-battery_4';
        if (percent > 70) return 'nf-fa-battery_3';
        if (percent > 40) return 'nf-fa-battery_2';
        if (percent > 20) return 'nf-fa-battery_1';
        return 'nf-fa-battery_0';
      }

      // Mute gets the crossed out icon, otherwise the icon follows the level.
      function volumeIcon(volume, isMuted) {
        if (isMuted || volume === 0) return 'nf-md-volume_off';
        if (volume < 40) return 'nf-md-volume_low';
        if (volume < 70) return 'nf-md-volume_medium';
        return 'nf-md-volume_high';
      }

      function systemDiskOf(disks) {
        return (
          disks.find(one => (one.mountPoint || '').toUpperCase().startsWith('C')) ||
          disks.find(one => !one.isRemovable) ||
          disks[0] ||
          null
        );
      }

      function render() {
        const out = providers.outputMap;

        // Media: the current session, or the last one we saw.
        const session = out.media?.currentSession || null;
        if (session) lastTrack = session;
        const track = session || lastTrack;
        mediaPlaying = Boolean(session?.isPlaying);
        updateVisualizer();

        show(tile['media-panel'], Boolean(track));

        if (track) {
          setClassToggle(tile['media-panel'], 'stale', !session);
          setTitle(
            tile['media-panel'],
            session
              ? 'Now playing'
              : 'Last played (nothing is playing right now)',
          );
          setClass(
            el['media-icon'],
            'nf ' + (track.isPlaying ? 'nf-md-pause' : 'nf-md-play'),
          );
          setText(
            el['media-text'],
            (track.title || 'Unknown track') +
              (track.artist ? '  ·  ' + track.artist : ''),
          );
        }

        show(tile['system-panel'], Boolean(out.cpu || out.memory));

        if (out.cpu) {
          const usage = Math.round(out.cpu.usage);
          setText(el.cpu, usage + '%');
          // The colour is the only thing that says a reading is worth noticing.
          setClass(el.cpu, usage > 85 ? 'high-usage' : '');
        }

        if (out.memory) {
          setText(el.memory, Math.round(out.memory.usage) + '%');
        }

        const playback = out.audio?.defaultPlaybackDevice || null;

        show(tile['controls-panel'], Boolean(playback));

        if (playback) {
          if (!isDraggingControl) {
            const volume = Math.round(playback.volume);
            setClass(
              el['volume-icon'],
              'nf ' + volumeIcon(volume, playback.isMuted),
            );
            setText(el.volume, playback.isMuted ? 'muted' : volume + '%');
          }
        }

        const disk = systemDiskOf(out.disk?.disks || []);
        const free = disk && disk.availableSpace;

        show(tile['storage-panel'], Boolean(free));

        if (free) {
          setText(
            el.storage,
            Math.round(free.iecValue) + free.iecUnit,
          );
          setTitle(
            tile['storage-panel'],
            'Storage · ' + (disk.mountPoint || disk.name || ''),
          );
        }

        // A null battery output is a failed reading, never an absent battery,
        // so fall back to the last good one instead of hiding the tile.
        if (out.battery && Number.isFinite(out.battery.chargePercent)) {
          lastBattery = out.battery;

        }

        const battery = lastBattery;
        const live = Boolean(out.battery && Number.isFinite(out.battery.chargePercent))
          && Date.now() - lastBatteryAt < BATTERY_STALE_AFTER_MS;

        show(tile['battery-panel'], Boolean(battery));
        setClassToggle(tile['battery-panel'], 'stale', Boolean(battery) && !live);

        if (battery) {
          const percent = Math.round(battery.chargePercent);

          setClass(el['battery-icon'], 'nf ' + batteryIcon(percent));
          setText(el.battery, percent + '%');
          show(el.charging, battery.isCharging);

          let title = `Battery · ${percent}%`;

          if (battery.powerConsumption !== null && battery.powerConsumption !== undefined) {
            const watts = Math.abs(battery.powerConsumption);
            const sign = battery.isCharging ? '+' : '-';
            title += ` (${sign}${watts.toFixed(1)} W)`;
          }

          setTitle(
            tile['battery-panel'],
            live ? title : title + ' · last reading, not live',
          );
        }
      }

      providers.onOutput(render);
      providers.raw.media.onError(render);
      render();

      // Only battery events prove freshness; other providers may keep rendering
      // the same non-null battery object after its reader stalls.
      //
      // A stalled reader does not come back on its own: the provider keeps
      // emitting the same error until it is recreated. Retry on a widening
      // delay and never stop, because a fixed number of attempts is what used
      // to leave the tile dimmed for good after a failed stretch - a resume
      // from sleep, or the reader dying once, was enough. Nothing is retried
      // while readings are arriving; every good one resets the delay.
      function armBatteryRestart() {
        if (batteryRestartTimer) return;
        const delay = Math.min(
          BATTERY_RETRY_MAX_MS,
          BATTERY_RETRY_BASE_MS * 2 ** batteryRetries,
        );
        batteryRestartTimer = setTimeout(async () => {
          batteryRestartTimer = null;
          batteryRetries += 1;
          render();
          try {
            await providers.raw.battery.restart();
          } catch (error) {
            // A restart that fails still leaves the next attempt armed: the
            // reader stays dead only if nothing ever tries again.
            console.warn('Battery reader restart failed', error);
          } finally {
            armBatteryRestart();
          }
        }, delay);
      }

      providers.raw.battery.onOutput(output => {
        if (!output || !Number.isFinite(output.chargePercent)) return;
        lastBatteryAt = Date.now();
        batteryRetries = 0;
        clearTimeout(batteryRestartTimer);
        batteryRestartTimer = null;
        armBatteryRestart();
        render();
      });
      providers.raw.battery.onError(() => {
        render();
        armBatteryRestart();
      });
      // Recover even when the first read fails or no event arrives at all.
      armBatteryRestart();

      /*
       * Weather does not come from a zebar provider: that one geolocates through
       * ipinfo.io and when the request failed its output went null, the tile
       * vanished and the only trace was an error. assets/weather.js remembers the
       * coordinates, retries on a widening delay, and reports nothing when it
       * cannot get a reading.
       */
      startWeather({
        onUpdate: data => {
          const now = data?.current || null;

          show(tile['weather-panel'], Boolean(now));

          if (!now) return;

          setClass(
            el['weather-icon'],
            'nf ' + weatherIcon(now.weather_code, now.is_day === 1),
          );
          setText(el.weather, Math.round(now.temperature_2m) + '°C');
          setTitle(
            tile['weather-panel'],
            'Forecast' + (data.place ? ' · ' + data.place : ''),
          );
        },
      });

      /* ------------------------------------------------------------------ *
       * Quick controls (volume & brightness drag/wheel)
       * ------------------------------------------------------------------ */

      let controlDragStartX = 0;
      let controlDragStartVal = 0;
      let controlDragMode = 'volume'; // 'volume' | 'brightness'
      let activeControlPointerId = null;
      let suppressControlsClick = false;

      let volumeInFlight = false;
      let pendingVolume = null;

      let currentBrightness = 70;
      let brightnessInFlight = false;
      let pendingBrightness = null;
      let wheelResetTimer = null;

      const PX_PER_PERCENT = 1.5;

      function brightnessIcon(level) {
        if (level > 66) return 'nf-md-brightness_7';
        if (level > 33) return 'nf-md-brightness_6';
        return 'nf-md-brightness_5';
      }

      async function pushVolume(volume) {
        const playback = providers.outputMap.audio?.defaultPlaybackDevice;
        if (!playback) return;

        if (volumeInFlight) {
          pendingVolume = volume;
          return;
        }

        volumeInFlight = true;

        try {
          if (playback.isMuted && volume > 0) {
            await providers.outputMap.audio.setMute(false, {
              deviceId: playback.deviceId,
            });
          }
          await providers.outputMap.audio.setVolume(volume, {
            deviceId: playback.deviceId,
          });
        } catch (error) {
          console.warn('Volume set failed:', error);
        } finally {
          volumeInFlight = false;
        }

        if (pendingVolume !== null) {
          const next = pendingVolume;
          pendingVolume = null;
          pushVolume(next);
        }
      }

      async function pushBrightness(level) {
        currentBrightness = level;

        if (brightnessInFlight) {
          pendingBrightness = level;
          return;
        }

        brightnessInFlight = true;

        try {
          const result = await zebar.shellExec('powershell.exe', [
            '-NoProfile',
            '-ExecutionPolicy',
            'Bypass',
            '-File',
            brightnessScript,
            '-Action',
            'set',
            '-Value',
            String(level),
          ]);
          const val = Number((result.stdout || '').trim());
          if (Number.isFinite(val) && val >= 0) {
            currentBrightness = val;
          }
        } catch (error) {
          console.warn('Brightness change failed:', error);
        } finally {
          brightnessInFlight = false;
        }

        if (pendingBrightness !== null) {
          const next = pendingBrightness;
          pendingBrightness = null;
          pushBrightness(next);
        }
      }

      async function readBrightnessOnce() {
        try {
          const result = await zebar.shellExec('powershell.exe', [
            '-NoProfile',
            '-ExecutionPolicy',
            'Bypass',
            '-File',
            brightnessScript,
            '-Action',
            'get',
          ]);
          const val = Number((result.stdout || '').trim());
          if (Number.isFinite(val) && val >= 0) {
            currentBrightness = val;
          }
        } catch (err) {
          console.warn('brightness read failed:', err);
        }
      }

      readBrightnessOnce();

      // Wheel over the volume tile nudges volume (or brightness if Shift held).
      tile['controls-panel'].addEventListener('wheel', event => {
        if (event.shiftKey) {
          event.preventDefault();
          const step = event.deltaY < 0 ? 5 : -5;
          const next = Math.max(0, Math.min(100, currentBrightness + step));
          currentBrightness = next;

          el['volume-icon'].className = 'nf ' + brightnessIcon(next);
          el.volume.textContent = next + '%';
          volumeTile.classList.add('is-adjusting');
          volumeTile.style.setProperty('--vol-percent', next + '%');

          pushBrightness(next);

          clearTimeout(wheelResetTimer);
          wheelResetTimer = setTimeout(() => {
            volumeTile.classList.remove('is-adjusting');
            volumeTile.style.removeProperty('--vol-percent');
            render();
          }, 700);
          return;
        }

        const playback = providers.outputMap.audio?.defaultPlaybackDevice;
        if (!playback) return;

        const step = event.deltaY < 0 ? 2 : -2;
        const next = Math.max(
          0,
          Math.min(100, Math.round(playback.volume) + step),
        );

        pushVolume(next);
      });

      // Click & hold, then drag left/right to scrub volume (or brightness if Shift held).
      const volumeTile = tile['controls-panel'];

      if (volumeTile) {
        volumeTile.addEventListener('pointerdown', event => {
          if (event.button !== 0) return;
          const playback = providers.outputMap.audio?.defaultPlaybackDevice;
          if (!playback && !event.shiftKey) return;

          activeControlPointerId = event.pointerId;
          controlDragStartX = event.clientX;
          controlDragMode = event.shiftKey ? 'brightness' : 'volume';

          if (controlDragMode === 'brightness') {
            controlDragStartVal = currentBrightness;
          } else {
            controlDragStartVal = playback ? Math.round(playback.volume) : 50;
          }

          isDraggingControl = false;

          try {
            volumeTile.setPointerCapture(event.pointerId);
          } catch (err) {}
        });

        volumeTile.addEventListener('pointermove', event => {
          if (
            activeControlPointerId === null ||
            event.pointerId !== activeControlPointerId
          ) {
            return;
          }

          const dx = event.clientX - controlDragStartX;

          if (!isDraggingControl) {
            if (Math.abs(dx) >= 3) {
              isDraggingControl = true;
              volumeTile.classList.add('is-adjusting');
              document.body.classList.add('is-dragging-volume');
            }
          }

          if (isDraggingControl) {
            const targetVal = Math.max(
              0,
              Math.min(100, Math.round(controlDragStartVal + dx / PX_PER_PERCENT)),
            );

            if (controlDragMode === 'brightness') {
              el.volume.textContent = targetVal + '%';
              el['volume-icon'].className = 'nf ' + brightnessIcon(targetVal);
              volumeTile.style.setProperty('--vol-percent', targetVal + '%');
              pushBrightness(targetVal);
            } else {
              el.volume.textContent = targetVal + '%';
              el['volume-icon'].className =
                'nf ' + volumeIcon(targetVal, targetVal === 0);
              volumeTile.style.setProperty('--vol-percent', targetVal + '%');
              pushVolume(targetVal);
            }
          }
        });

        function endControlDrag(event) {
          if (
            activeControlPointerId === null ||
            event.pointerId !== activeControlPointerId
          ) {
            return;
          }

          if (
            volumeTile.hasPointerCapture &&
            volumeTile.hasPointerCapture(event.pointerId)
          ) {
            try {
              volumeTile.releasePointerCapture(event.pointerId);
            } catch (err) {}
          }

          activeControlPointerId = null;

          if (isDraggingControl) {
            const wasBrightness = controlDragMode === 'brightness';
            isDraggingControl = false;
            volumeTile.classList.remove('is-adjusting');
            volumeTile.style.removeProperty('--vol-percent');
            document.body.classList.remove('is-dragging-volume');

            // Suppress the click event that triggers right after pointer release
            suppressControlsClick = true;
            setTimeout(() => {
              suppressControlsClick = false;
            }, 150);

            if (wasBrightness) {
              // Smoothly restore volume reading after adjusting brightness
              setTimeout(() => {
                if (!isDraggingControl) render();
              }, 400);
            }
          }
        }

        volumeTile.addEventListener('pointerup', endControlDrag);
        volumeTile.addEventListener('pointercancel', endControlDrag);
        volumeTile.addEventListener('lostpointercapture', endControlDrag);
      }

      /* ------------------------------------------------------------------ *
       * Bar state
       * ------------------------------------------------------------------ */

      /*
       * The guard reports `fg max` while the foreground window is maximized and
       * `fg float` otherwise. While a window is maximized the bar fills the whole
       * strip it is given; the rest of the time `is-floating` lifts it off the
       * screen edge (see styles.css).
       *
       * This was a second PowerShell of its own (fg-state.ps1). The guard was
       * already watching the foreground window to know whether a click belonged to
       * one of our own windows, so it reports the answer instead of a second
       * process polling for the same thing.
       */
      function setForegroundState(state) {
        setClassToggle(document.body, 'is-floating', state === 'float');
      }

      function setAppName(name) {
        setText(el['app-name'], name);
        show(el['app-name'], Boolean(name));
      }

      /* ------------------------------------------------------------------ *
       * Panels
       * ------------------------------------------------------------------ */

      const PANEL_NAMES = [
        'battery-panel',
        'about-panel',
        'calendar-panel',
        'system-panel',
        'media-panel',
        'controls-panel',
        'storage-panel',
        'windows-menu',
        'weather-panel',
        'settings-panel',
      ];

      const panels = new Map(
        PANEL_NAMES.map(name => [name, { open: false, opening: false, closedAt: 0 }]),
      );

      function updatePanelStates() {
        for (const node of document.querySelectorAll('[data-panel]')) {
          const state = panels.get(node.dataset.panel);
          node.setAttribute('aria-expanded', String(Boolean(state?.open)));
          node.setAttribute('aria-busy', String(Boolean(state?.opening)));
        }
      }

      // Fetch dimensions once, on demand. Position is read only when opening a
      // popup, so window/display changes do not need a polling loop.
      let packConfig;
      async function placementFor(name, node) {
        packConfig ||= fetch('./zpack.json').then(response => {
          if (!response.ok) throw new Error('Could not read panel dimensions');
          return response.json();
        }).catch(error => { packConfig = null; throw error; });
        const [{ currentMonitor }, config, barPosition] = await Promise.all([
          import('./assets/vendor/tauri-window.js'), packConfig, widget.tauriWindow.outerPosition(),
        ]);
        const monitor = await currentMonitor();
        if (!monitor?.name) throw new Error('Display information unavailable');
        const preset = config.widgets.find(entry => entry.name === name)?.presets[0];
        if (!preset) throw new Error('Panel dimensions unavailable');
        return anchoredPlacement({
          rect: node.getBoundingClientRect(), barPosition, monitor,
          barBottom: document.getElementById('root').getBoundingClientRect().bottom,
          width: parseFloat(preset.width), height: parseFloat(preset.height),
          align: name === 'windows-menu' || name === 'media-panel' ? 'start' : 'center',
        });
      }

      /*
       * How long a panel counts as "just closed".
       *
       * The guard dismisses a panel on any click outside it, which includes a
       * click on this bar. That close is reported back here, and the report can
       * land in the gap between the mouse going down and the click handler
       * running. Without this the handler would see nothing open and reopen the
       * panel with the same click that just dismissed it.
       *
       * Long enough to cover a slow click, short enough that deliberately
       * reopening a panel straight after closing it still works.
       */
      const JUST_CLOSED_MS = 350;

      /*
       * Which monitor this bar is on. Names the guard so reloading this bar
       * retires its old helper. Popup placement is resolved separately on click.
       *
       * Bounded, and never awaited by anything that has to happen: an await on
       * this that never came back is what stopped the guard from starting at all.
       */
      const monitorInfo = (async () => {
        const info = { owner: 'default' };

        try {
          const { currentMonitor } = await import(
            './assets/vendor/tauri-window.js'
          );

          const current = await Promise.race([
            currentMonitor(),
            new Promise((resolve, reject) =>
              setTimeout(() => reject(new Error('timed out')), 2000),
            ),
          ]);

          if (current) info.owner = `m${current.position.x}x${current.position.y}`;

        } catch (err) {
          console.warn('Monitor lookup failed, using the default guard owner.', err);
        }

        return info;
      })();

      /*
       * One long lived helper watches every panel window and closes it as soon as
       * a click lands outside it, wherever that click lands, this bar included. It
       * reads the mouse state rather than page events, which is what makes it
       * reliable, and it reports what it does on stdout:
       *
       *   open <name> | closed <name> | gone <name>
       *
       * So the bar only ever opens panels. Its one job on the closing side is not
       * to reopen the panel that the click it is handling has just dismissed.
       */
      let panelGuard = null;
      let guardStarting = null;
      let guardStartedAt = 0;
      let guardRetryTimer = null;
      let shuttingDown = false;
      window.addEventListener('beforeunload', () => {
        shuttingDown = true;
        clearTimeout(guardRetryTimer);
        panelGuard?.kill();
      }, { once: true });

      function startPanelGuard() {
        if (shuttingDown) return;
        if (guardStarting) return guardStarting;

        guardStartedAt = Date.now();

        guardStarting = (async () => {
          const { owner } = await monitorInfo;

          const guard = await zebar.shellSpawn('powershell.exe', [
            '-NoProfile',
            '-ExecutionPolicy',
            'Bypass',
            '-File',
            windowCtlScript,
            '-Action',
            'guard',
            '-Match',
            PANEL_NAMES.join(','),
            '-Owner',
            owner,
            '-BarTitle',
            `Zebar - ${widget.packId} / ${widget.name}`,
          ]);

          guard.onStdout(line => {
            const text = line.trim();
            const space = text.indexOf(' ');
            const event = space < 0 ? text : text.slice(0, space);
            // An application's name can contain spaces, so only the first is a
            // separator.
            const rest = space < 0 ? '' : text.slice(space + 1);

            if (event === 'fg') {
              setForegroundState(rest);
              return;
            }

            if (event === 'app') {
              setAppName(rest);
              return;
            }

            const state = panels.get(rest);

            if (!state) return;

            if (event === 'open') state.open = true;

            if (event === 'closed' || event === 'gone') {
              state.open = false;
              state.closedAt = Date.now();
            }
            updatePanelStates();
          });

          guard.onStderr(line => console.warn('panel guard:', line));

          guard.onExit(() => {
            panelGuard = null;
            guardStarting = null;
            guardDiag('guard exited');
            panels.forEach(state => {
              state.open = false;
            });
            updatePanelStates();

            // The bar's own state came from the guard, so it is no longer known.
            document.body.classList.remove('is-floating');
            setAppName('');

            // The guard is the only thing that dismisses a panel, so it does not
            // get to stay dead. It also exits on a lifetime cap by design.
            if (!shuttingDown) guardRetryTimer = setTimeout(startPanelGuard, 1000);
          });

          panelGuard = guard;
        })().catch(err => {
          console.warn('Panel guard failed to start:', err);
          guardDiag('guard start failed: ' + ((err && err.message) || err));
          guardStarting = null;
          if (!shuttingDown) guardRetryTimer = setTimeout(startPanelGuard, 5000);
        });

        return guardStarting;
      }

      /*
       * Closing a single panel, for when the tile of an open panel is clicked. The
       * guard normally gets there first on the same click; this is the backstop.
       *
       * Not the guard's stdin, which would be cheaper and does not work: zebar's
       * shellWrite resolves without delivering, so the write looks fine from here
       * and the guard never sees a line.
       */
      function closeWidget(name) {
        return zebar
          .shellExec('powershell.exe', [
            '-NoProfile',
            '-ExecutionPolicy',
            'Bypass',
            '-File',
            windowCtlScript,
            '-Action',
            'close',
            '-Match',
            name,
          ])
          .catch(err => console.warn('Could not close panel:', err));
      }

      /*
       * One panel at a time. Clicking a tile opens its panel; clicking the tile of
       * the panel already open closes it. Switching from one panel to another does
       * not close anything from here, because the guard is already closing the old
       * one for two reasons at once: the click was outside it, and it retires the
       * previous panel whenever a new one appears.
       */
      let panelRequest = 0;
      let panelQueue = Promise.resolve();
      async function togglePanel(name, node) {
        const state = panels.get(name);
        const justClosed = Date.now() - state.closedAt < JUST_CLOSED_MS;

        if (state.opening) {
          panelRequest += 1;
          state.open = false;
          updatePanelStates();
          return;
        }

        if (state.open || justClosed) {
          if (state.open) {
            state.open = false;
            state.closedAt = Date.now();
            closeWidget(name);
            updatePanelStates();
          }

          return;
        }

        const request = ++panelRequest;
        state.opening = true;
        state.open = true;
        updatePanelStates();
        panelQueue = panelQueue.then(async () => {
          try {
            if (request !== panelRequest) return;
            const placement = await placementFor(name, node);
            if (request !== panelRequest) return;
            await zebar.startWidget(name, placement, { packId: widget.packId });
            if (request !== panelRequest) await closeWidget(name);
          } catch (err) {
            state.open = false;
            node.title = 'Could not open this panel. Click to retry.';
            console.warn('Could not open panel:', err);
          } finally {
            state.opening = false;
            if (request !== panelRequest) state.open = false;
            updatePanelStates();
          }
        });
      }

      for (const node of document.querySelectorAll('[data-panel]')) {
        const name = node.dataset.panel;
        node.addEventListener('click', () => {
          if (name === 'controls-panel' && suppressControlsClick) return;
          togglePanel(name, node);
        });
        node.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            togglePanel(name, node);
          }
        });
      }

      document.querySelector('.app').addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          panelRequest += 1;
          panels.forEach((state, name) => {
            if (state.open && !state.opening) closeWidget(name);
            state.open = false;
          });
          updatePanelStates();
        }
        if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
        const controls = [...document.querySelectorAll('.app [tabindex="0"], .app button')]
          .filter(node => node.getClientRects().length);
        const current = controls.indexOf(document.activeElement);
        if (current < 0) return;
        event.preventDefault();
        const index = event.key === 'Home' ? 0 : event.key === 'End' ? controls.length - 1
          : (current + (event.key === 'ArrowRight' ? 1 : -1) + controls.length) % controls.length;
        controls[index]?.focus();
      });

      // Started now rather than on the first click, so the first panel is watched
      // from the moment it appears.
      // Started now rather than on the first click, so the first panel is watched
      // from the moment it appears.
      startPanelGuard();

      /*
       * The guard is the only thing that dismisses a panel, so it must not be
       * possible to end up with none. Its own exit reports back here and arms a
       * retry, and a failed start retries on its own; this covers the case those
       * do not: a page rebuilt under the guard, a report that never arrives, or a
       * start that never settles. A dead guard used to leave every panel it had
       * been watching unable to close.
       */
      const GUARD_START_TIMEOUT_MS = 20000;
      setInterval(() => {
        if (shuttingDown || panelGuard) return;

        const stalled = guardStarting &&
          Date.now() - guardStartedAt > GUARD_START_TIMEOUT_MS;

        if (guardStarting && !stalled) return;

        if (stalled) console.warn('Panel guard did not start in time; retrying.');
        guardStarting = null;
        startPanelGuard();
      }, 15000);
    </script>
  </body>
</html>
