<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      styles.css @imports the icon font stylesheet, which in turn asks for the
      woff2: three requests discovered one after another, with the icon glyphs
      not drawn until the last one lands. Preloading starts all three at once.
    -->
    <link rel="preload" href="./assets/icons.css" as="style" />
    <link rel="preload" href="./assets/nerdfont.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <!--
      The zebar client module and its dependencies are vendored (assets/vendor),
      for the same reason the icon font is: a panel is a fresh webview every time
      it opens, and importing the module graph from a CDN put three round trips
      in front of the first paint. Preloading them here starts all seven files at
      once instead of discovering each one after the previous has parsed.
    -->
    <link rel="modulepreload" href="./assets/vendor/zebar.js" />
    <link rel="modulepreload" href="./assets/vendor/zod.js" />
    <link rel="modulepreload" href="./assets/vendor/luxon.js" />
    <link rel="modulepreload" href="./assets/vendor/tauri-core.js" />
    <link rel="modulepreload" href="./assets/vendor/tauri-event.js" />
    <link rel="modulepreload" href="./assets/vendor/tauri-window.js" />
    <link rel="modulepreload" href="./assets/vendor/glazewm.js" />
  </head>
  <body class="panel-body">
    <div class="panel weather-panel">
      <div class="panel-header">
        <i class="nf nf-weather-cloudy" id="header-icon"></i>
        <span class="panel-title">Weather</span>
        <span class="panel-place" id="place"></span>
      </div>

      <div class="weather-now">
        <i class="nf weather-now-icon" id="now-icon"></i>

        <span class="weather-now-temp" id="now-temp">--</span>

        <div class="weather-now-meta">
          <span id="now-feels">feels like --</span>
          <span id="now-wind">wind --</span>
          <span id="now-humidity">--% humidity</span>
        </div>
      </div>

      <div class="panel-separator"></div>

      <div class="forecast" id="forecast"></div>
    </div>

    <script type="module">
      import * as zebar from './assets/vendor/zebar.js';
      import { fitWindowToCard } from './assets/panel.js';
      import { startWeather, weatherIcon } from './assets/weather.js';

      const widget = zebar.currentWidget();

      // Keep this window the same height as the card (see assets/panel.js).
      fitWindowToCard(widget);

      const el = {
        headerIcon: document.getElementById('header-icon'),
        nowIcon: document.getElementById('now-icon'),
        nowTemp: document.getElementById('now-temp'),
        nowFeels: document.getElementById('now-feels'),
        nowWind: document.getElementById('now-wind'),
        nowHumidity: document.getElementById('now-humidity'),
        place: document.getElementById('place'),
        forecast: document.getElementById('forecast'),
      };

      /*
       * Current conditions and the daily rows come from one Open-Meteo request,
       * shared with the bar tile (assets/weather.js). The zebar `weather`
       * provider used to supply the current reading, but it geolocates through
       * ipinfo.io on every start and had no way to recover when that call
       * failed. Nothing here reports a failure: no reading means the panel keeps
       * its placeholders.
       */
      let latest = null;

      function dayLabel(isoDate) {
        const date = new Date(isoDate + 'T12:00:00');

        return date.toLocaleDateString(undefined, { weekday: 'short' });
      }

      function render() {
        if (!latest) return;

        const now = latest.current;
        const daily = latest.daily;

        el.place.textContent = latest.place || '';

        if (now) {
          const isDay = now.is_day === 1;
          const icon = weatherIcon(now.weather_code, isDay);

          el.nowTemp.textContent = Math.round(now.temperature_2m) + '°';
          el.nowIcon.className = 'nf weather-now-icon ' + icon;
          el.headerIcon.className = 'nf ' + icon;
          el.nowFeels.textContent =
            'feels like ' + Math.round(now.apparent_temperature) + '°';
          el.nowWind.textContent =
            'wind ' + Math.round(now.wind_speed_10m) + ' km/h';
          el.nowHumidity.textContent = now.relative_humidity_2m + '% humidity';
        }

        if (!daily) return;

        el.forecast.innerHTML = daily.time
          .map((date, index) => {
            const code = daily.weather_code[index];
            const high = Math.round(daily.temperature_2m_max[index]);
            const low = Math.round(daily.temperature_2m_min[index]);
            const chance = daily.precipitation_probability_max[index];

            return (
              '<div class="forecast-row">' +
              '<span class="forecast-day">' + dayLabel(date) + '</span>' +
              '<i class="nf ' + weatherIcon(code, true) + '"></i>' +
              '<span class="forecast-precip">' +
              (chance === null || chance === undefined ? '' : chance + '%') +
              '</span>' +
              '<span class="forecast-range">' +
              '<span class="forecast-high">' + high + '°</span>' +
              '<span class="forecast-low">' + low + '°</span>' +
              '</span>' +
              '</div>'
            );
          })
          .join('');
      }

      const stopWeather = startWeather({
        onUpdate: data => {
          latest = data;
          render();
        },
      });

      window.addEventListener('beforeunload', () => stopWeather());

      /* Closing is done from outside, by the helper the bar starts when it
         opens this panel (see window-ctl.ps1). Escape here is a bonus. */
      // Animate out first, then close: the window is transparent, so a short
      // fade and lift is visible before it disappears.
      function close() {
        const panel = document.querySelector('.panel');

        if (!panel || panel.classList.contains('closing')) {
          widget.close();
          return;
        }

        panel.classList.add('closing');
        setTimeout(() => widget.close(), 130);
      }

      window.addEventListener('keydown', event => {
        if (event.key === 'Escape') close();
      });

    </script>
  </body>
</html>
