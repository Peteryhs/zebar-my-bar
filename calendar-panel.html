<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="preload" href="./assets/icons.css" as="style" />
    <link rel="preload" href="./assets/nerdfont.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" type="text/css" href="./styles.css" />

    <link rel="modulepreload" href="./assets/vendor/zebar.js" />
    <link rel="modulepreload" href="./assets/vendor/zod.js" />
    <link rel="modulepreload" href="./assets/vendor/luxon.js" />
    <link rel="modulepreload" href="./assets/vendor/tauri-core.js" />
    <link rel="modulepreload" href="./assets/vendor/tauri-event.js" />
    <link rel="modulepreload" href="./assets/vendor/tauri-window.js" />
    <link rel="modulepreload" href="./assets/vendor/glazewm.js" />
  </head>
  <body class="panel-body">
    <div class="panel calendar-panel">
      <div class="panel-header">
        <i class="nf nf-md-calendar_month"></i>
        <span class="panel-title" id="month-title">Calendar</span>
        <button class="panel-close" id="previous" title="Previous month">
          <i class="nf nf-md-chevron_left"></i>
        </button>
        <button class="panel-close" id="today" title="Today">
          <i class="nf nf-md-circle_small"></i>
        </button>
        <button class="panel-close" id="next" title="Next month">
          <i class="nf nf-md-chevron_right"></i>
        </button>
      </div>

      <!-- Month on the left with the weather for whichever day is selected beneath
           it, the day itself on the right. -->
      <div class="cal-body">
        <div class="cal-month">
          <div class="cal-grid" id="weekdays"></div>
          <div class="cal-grid" id="days"></div>
          <div class="cal-weather" id="weather"></div>
        </div>

        <div class="cal-day-view">
          <div class="cal-upnext" id="upnext" hidden></div>
          <div class="cal-day-title" id="day-title"></div>
          <div class="cal-allday" id="allday"></div>
          <div class="cal-timeline" id="timeline"></div>
        </div>
      </div>

      <!-- Details for one event, over the panel, when one is clicked. -->
      <div class="cal-detail" id="detail" hidden></div>
    </div>

    <script type="module">
      import * as zebar from './assets/vendor/zebar.js';
      import { fitWindowToCard } from './assets/panel.js';
      import { parseIcs } from './assets/ics.js';
      import { resolveCoords, fetchWeather, weatherIcon } from './assets/weather.js';

      const widget = zebar.currentWidget();

      fitWindowToCard(widget);

      const packDir = widget.htmlPath.replace(/[\\/][^\\/]*$/, '');
      const calendarScript = `${packDir}\\scripts\\calendar.ps1`;

      // Warn about an event this long before it starts.
      const WARN_MINUTES = 15;

      /*
       * The axis covers the whole day at a fixed scale and scrolls, rather than the
       * day's events being squeezed into the height available. Both have been tried:
       * fitting the events in means hours outside them cannot be reached at all, and
       * a day is more than its meetings. So the scale is fixed, an hour is legible,
       * and the view opens on the part worth looking at.
       */
      const HOUR_HEIGHT = 34;
      const MIN_BLOCK_PX = 11;
      // Below this a block cannot carry both its time and its title, so it carries
      // the title.
      const SHORT_BLOCK_PX = 26;
      const COLUMN_GAP_PC = 2;
      const MIN_HOUR_GAP_PX = 15;

      const el = {
        title: document.getElementById('month-title'),
        weekdays: document.getElementById('weekdays'),
        days: document.getElementById('days'),
        weather: document.getElementById('weather'),
        dayTitle: document.getElementById('day-title'),
        allday: document.getElementById('allday'),
        timeline: document.getElementById('timeline'),
        upnext: document.getElementById('upnext'),
        detail: document.getElementById('detail'),
      };

      const today = startOfDay(new Date());
      let shownMonth = new Date(today.getFullYear(), today.getMonth(), 1);
      let selected = new Date(today);
      let events = [];
      // The events drawn for the selected day, so a click can find its way back from
      // a block to the event it stands for.
      let drawn = [];
      let forecast = null;

      function startOfDay(date) {
        return new Date(date.getFullYear(), date.getMonth(), date.getDate());
      }

      function sameDay(a, b) {
        return (
          a.getFullYear() === b.getFullYear() &&
          a.getMonth() === b.getMonth() &&
          a.getDate() === b.getDate()
        );
      }

      function dayKey(date) {
        return (
          date.getFullYear() +
          '-' +
          String(date.getMonth() + 1).padStart(2, '0') +
          '-' +
          String(date.getDate()).padStart(2, '0')
        );
      }

      function timeText(date) {
        return date.toLocaleTimeString(undefined, {
          hour: 'numeric',
          minute: '2-digit',
        });
      }

      function durationText(from, to) {
        const minutes = Math.round((to - from) / 60000);

        if (minutes < 60) return minutes + ' min';

        const hours = Math.floor(minutes / 60);
        const rest = minutes % 60;

        return hours + ' h' + (rest ? ' ' + String(rest).padStart(2, '0') : '');
      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      /*
       * Weekday initials in the reader's own locale, starting on whichever day their
       * locale starts on rather than assuming Monday.
       */
      const firstDayOfWeek = (() => {
        try {
          const locale = new Intl.Locale(navigator.language);
          const week = locale.getWeekInfo?.() || locale.weekInfo;

          // getWeekInfo counts Monday as 1 and Sunday as 7; JS counts Sunday as 0.
          if (week && week.firstDay) return week.firstDay % 7;
        } catch {
          // Not supported here.
        }

        return 1;
      })();

      function renderWeekdays() {
        const names = [];

        for (let i = 0; i < 7; i++) {
          const sample = new Date(2024, 8, 1 + ((firstDayOfWeek + i) % 7));

          names.push(
            '<div class="cal-weekday">' +
              sample.toLocaleDateString(undefined, { weekday: 'narrow' }) +
              '</div>',
          );
        }

        el.weekdays.innerHTML = names.join('');
      }

      function eventsByDay() {
        const map = new Map();

        for (const event of events) {
          const key = dayKey(event.start);

          if (!map.has(key)) map.set(key, []);
          map.get(key).push(event);
        }

        return map;
      }

      /*
       * Where an event sits relative to now: done with, happening, or still to come.
       * This is what the colour says, so it is worked out in one place.
       */
      function stateOf(event, now) {
        if (event.allDay) {
          if (!sameDay(event.start, now)) return event.start < now ? 'past' : 'future';
          return 'now';
        }

        if (event.end <= now) return 'past';
        if (event.start <= now) return 'now';

        return 'future';
      }

      function renderMonth() {
        el.title.textContent = shownMonth.toLocaleDateString(undefined, {
          month: 'long',
          year: 'numeric',
        });

        const byDay = eventsByDay();
        const firstOfMonth = new Date(shownMonth);
        const lead = (firstOfMonth.getDay() - firstDayOfWeek + 7) % 7;
        const start = new Date(firstOfMonth);
        start.setDate(start.getDate() - lead);

        const cells = [];

        // Six weeks always, so the panel does not change height as months change.
        for (let i = 0; i < 42; i++) {
          const date = new Date(start);
          date.setDate(date.getDate() + i);

          const classes = ['cal-day'];

          if (date.getMonth() !== shownMonth.getMonth()) classes.push('other-month');
          if (sameDay(date, today)) classes.push('today');
          if (sameDay(date, selected)) classes.push('selected');
          if (byDay.has(dayKey(date))) classes.push('has-events');

          cells.push(
            '<button class="' +
              classes.join(' ') +
              '" data-date="' +
              dayKey(date) +
              '">' +
              date.getDate() +
              '</button>',
          );
        }

        el.days.innerHTML = cells.join('');
      }

      /*
       * Groups of events that overlap, directly or through a chain of others, and
       * the columns within each group.
       *
       * Scoped to the group on purpose. Assigning columns across the whole day would
       * mean one double booking at nine o'clock left every other event that day at
       * half width for no reason. Within a group an event takes the first column free
       * by the time it starts, so a run of back to back meetings shares one column
       * and reads as a single line down the day.
       */
      function assignColumns(timed) {
        const placed = [];
        let group = [];
        let groupEnd = null;

        const flush = () => {
          if (group.length === 0) return;

          const columnEnds = [];

          for (const event of group) {
            let column = columnEnds.findIndex(end => end <= event.start);

            if (column === -1) {
              columnEnds.push(event.end);
              column = columnEnds.length - 1;
            } else {
              columnEnds[column] = event.end;
            }

            placed.push({ event, column, columns: 0 });
          }

          // Every event in the group is divided by the same number of columns, so
          // they line up with each other.
          const width = Math.max(1, columnEnds.length);

          for (let i = placed.length - group.length; i < placed.length; i++) {
            placed[i].columns = width;
          }

          group = [];
          groupEnd = null;
        };

        for (const event of timed) {
          if (groupEnd !== null && event.start >= groupEnd) flush();

          group.push(event);
          groupEnd = groupEnd === null || event.end > groupEnd ? event.end : groupEnd;
        }

        flush();

        return placed;
      }

      // Clamped to the day being shown, so something running past midnight does not
      // reach beyond the axis.
      function clampToDay(event, dayStart, dayEnd) {
        return {
          start: event.start < dayStart ? dayStart : event.start,
          end: event.end > dayEnd ? dayEnd : event.end,
        };
      }

      let scrolledForDay = null;

      function renderDay() {
        const now = new Date();
        const forDay = eventsByDay().get(dayKey(selected)) || [];
        const isToday = sameDay(selected, today);

        el.dayTitle.textContent = isToday
          ? 'Today'
          : selected.toLocaleDateString(undefined, {
              weekday: 'long',
              day: 'numeric',
              month: 'long',
            });

        // All day events have no place on a time axis, so they sit above it.
        const allDay = forDay.filter(event => event.allDay);

        el.allday.innerHTML = allDay
          .map((event, index) => {
            // Indexed from the end of the timed list, so one click handler can serve
            // both the all day row and the timeline.
            const at = forDay.filter(one => !one.allDay).length + index;

            return (
              '<div class="cal-allday-item is-' + stateOf(event, now) +
              '" data-event="' + at + '" title="' + escapeHtml(event.summary) + '">' +
              escapeHtml(event.summary) + '</div>'
            );
          })
          .join('');

        const timed = forDay
          .filter(event => !event.allDay)
          .sort((a, b) => a.start - b.start);

        drawn = timed.concat(allDay);

        const dayStart = startOfDay(selected);
        const dayEnd = new Date(dayStart.getTime() + 24 * 3600 * 1000);
        const trackHeight = 24 * HOUR_HEIGHT;
        const yOf = when =>
          Math.round(((when - dayStart) / (dayEnd - dayStart)) * trackHeight);

        const hourStep = Math.max(1, Math.ceil(MIN_HOUR_GAP_PX / HOUR_HEIGHT));
        const hours = [];

        for (let hour = 0; hour <= 24; hour += hourStep) {
          const at = new Date(dayStart.getTime() + hour * 3600000);

          hours.push(
            '<div class="cal-hour" style="top: ' + yOf(at) + 'px">' +
              '<span class="cal-hour-label">' +
              (hour === 24
                ? ''
                : at.toLocaleTimeString(undefined, { hour: 'numeric' })) +
              '</span></div>',
          );
        }

        const blocks = assignColumns(timed).map(({ event, column, columns }) => {
          const bounds = clampToDay(event, dayStart, dayEnd);
          const top = yOf(bounds.start);
          const height = Math.max(MIN_BLOCK_PX, yOf(bounds.end) - top);
          const width = 100 / columns;
          const when = timeText(event.start) + ' – ' + timeText(event.end);
          const classes =
            'cal-block is-' + stateOf(event, now) +
            (height < SHORT_BLOCK_PX ? ' is-short' : '');

          return (
            '<div class="' + classes + '" data-event="' + timed.indexOf(event) +
            '" style="top: ' + top + 'px; height: ' + height + 'px; left: ' +
            (column * width) + '%; width: calc(' + width + '% - ' + COLUMN_GAP_PC +
            'px)" title="' + escapeHtml(when + '  ·  ' + event.summary) + '">' +
            '<span class="cal-block-time">' + escapeHtml(when) + '</span>' +
            '<span class="cal-block-title">' + escapeHtml(event.summary) + '</span>' +
            '</div>'
          );
        });

        const marker = isToday
          ? '<div class="cal-now" style="top: ' + yOf(now) + 'px">' +
            '<span class="cal-now-label">' + timeText(now) + '</span></div>'
          : '';

        el.timeline.innerHTML =
          '<div class="cal-track" style="height: ' + trackHeight + 'px">' +
          hours.join('') +
          '<div class="cal-lanes">' + blocks.join('') + '</div>' +
          marker +
          '</div>';

        /*
         * Opened on the part worth looking at, once per day shown rather than on
         * every redraw: the half minute tick would otherwise keep pulling the view
         * back while it was being read.
         */
        const key = dayKey(selected);

        if (scrolledForDay !== key) {
          scrolledForDay = key;

          const focus = isToday
            ? yOf(now)
            : timed.length
              ? yOf(timed[0].start)
              : 8 * HOUR_HEIGHT;

          el.timeline.scrollTop = Math.max(0, focus - 60);
        }
      }

      /*
       * The weather for whichever day is selected, under the month.
       *
       * Only as far ahead as the forecast goes, which is a week; past that the space
       * is left empty rather than filled with a guess. Same Open-Meteo response the
       * bar's tile uses, and the same cached coordinates, so this costs one request.
       */
      function renderWeather() {
        const daily = forecast?.daily;

        if (!daily) {
          el.weather.innerHTML = '';
          return;
        }

        const index = daily.time.indexOf(dayKey(selected));

        if (index < 0) {
          el.weather.innerHTML = '';
          return;
        }

        const high = Math.round(daily.temperature_2m_max[index]);
        const low = Math.round(daily.temperature_2m_min[index]);
        const rain = daily.precipitation_probability_max?.[index];
        const sunrise = daily.sunrise?.[index];
        const sunset = daily.sunset?.[index];

        const parts = [
          '<i class="nf ' + weatherIcon(daily.weather_code[index], true) + ' cal-weather-icon"></i>',
          '<span class="cal-weather-temps">' +
            '<span class="cal-weather-high">' + high + '°</span>' +
            '<span class="cal-weather-low">' + low + '°</span>' +
            '</span>',
        ];

        if (rain !== null && rain !== undefined) {
          parts.push(
            '<span class="cal-weather-rain"><i class="nf nf-md-water_percent"></i>' +
              rain + '%</span>',
          );
        }

        const sun = [];

        if (sunrise) {
          sun.push(
            '<span><i class="nf nf-weather-sunrise"></i>' +
              timeText(new Date(sunrise)) + '</span>',
          );
        }

        if (sunset) {
          sun.push(
            '<span><i class="nf nf-weather-sunset"></i>' +
              timeText(new Date(sunset)) + '</span>',
          );
        }

        el.weather.innerHTML =
          '<div class="cal-weather-row">' + parts.join('') + '</div>' +
          (sun.length ? '<div class="cal-weather-sun">' + sun.join('') + '</div>' : '');
      }

      /*
       * The next event about to start, if it is close enough to be worth saying so.
       *
       * Always about today, whichever day is selected: it is a warning, not part of
       * what you are browsing.
       */
      function renderUpNext() {
        const now = new Date();
        const limit = new Date(now.getTime() + WARN_MINUTES * 60000);

        const soon = events
          .filter(event => !event.allDay && event.start > now && event.start <= limit)
          .sort((a, b) => a.start - b.start)[0];

        if (!soon) {
          el.upnext.hidden = true;
          return;
        }

        const minutes = Math.max(1, Math.round((soon.start - now) / 60000));

        el.upnext.hidden = false;
        el.upnext.innerHTML =
          '<i class="nf nf-md-bell_ring"></i>' +
          '<span class="cal-upnext-body">' +
          '<span class="cal-upnext-when">in ' + minutes + ' min · ' + timeText(soon.start) + '</span>' +
          '<span class="cal-upnext-title">' + escapeHtml(soon.summary) + '</span>' +
          '</span>';
      }

      /*
       * One event in full, over the panel.
       *
       * A block on the timeline is as wide as the column allows and as tall as the
       * event is long, which for a fifteen minute slot is room for a truncated title
       * and nothing else. This is where the rest of it lives.
       */
      function showDetail(event) {
        const when = event.allDay
          ? 'All day'
          : timeText(event.start) + ' – ' + timeText(event.end) +
            '  ·  ' + durationText(event.start, event.end);

        const rows = [
          '<div class="cal-detail-row"><i class="nf nf-md-clock_outline"></i>' +
            '<span>' + escapeHtml(when) + '</span></div>',
          '<div class="cal-detail-row"><i class="nf nf-md-calendar_month"></i><span>' +
            escapeHtml(
              event.start.toLocaleDateString(undefined, {
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric',
              }),
            ) + '</span></div>',
        ];

        if (event.location) {
          rows.push(
            '<div class="cal-detail-row"><i class="nf nf-md-map_marker"></i><span>' +
              escapeHtml(event.location) + '</span></div>',
          );
        }

        if (event.description) {
          rows.push(
            '<div class="cal-detail-row"><i class="nf nf-md-text"></i>' +
              '<span class="cal-detail-description">' +
              escapeHtml(event.description).replace(/\n/g, '<br />') +
              '</span></div>',
          );
        }

        el.detail.hidden = false;
        el.detail.innerHTML =
          '<div class="cal-detail-head">' +
          '<span class="cal-detail-title">' + escapeHtml(event.summary) + '</span>' +
          '<button class="panel-close" id="detail-close" title="Close">' +
          '<i class="nf nf-md-close"></i></button>' +
          '</div>' +
          rows.join('');

        document
          .getElementById('detail-close')
          .addEventListener('click', hideDetail);
      }

      function hideDetail() {
        el.detail.hidden = true;
        el.detail.innerHTML = '';
      }

      function detailOpen() {
        return !el.detail.hidden;
      }

      function render() {
        renderMonth();
        renderWeather();
        renderUpNext();
        renderDay();
      }

      // One handler for the timeline and the all day row, since both carry the index
      // of the event they stand for.
      document.querySelector('.cal-day-view').addEventListener('click', event => {
        const target = event.target.closest('[data-event]');

        if (!target) return;

        const one = drawn[Number(target.dataset.event)];

        if (one) showDetail(one);
      });

      /*
       * A click anywhere else puts the details away.
       *
       * This runs last, on the way up from wherever the click landed, so the two
       * exceptions have to be named: inside the card itself, and on another event,
       * which the handler above is in the middle of opening.
       */
      document.addEventListener('click', event => {
        if (!detailOpen()) return;
        if (event.target.closest('.cal-detail')) return;
        if (event.target.closest('[data-event]')) return;

        hideDetail();
      });

      el.days.addEventListener('click', event => {
        const button = event.target.closest('.cal-day');

        if (!button) return;

        hideDetail();

        const [year, month, day] = button.dataset.date.split('-').map(Number);
        selected = new Date(year, month - 1, day);

        // Clicking a day in the greyed edge of the grid moves the month with it.
        if (selected.getMonth() !== shownMonth.getMonth()) {
          shownMonth = new Date(selected.getFullYear(), selected.getMonth(), 1);
          loadEvents();
        }

        render();
      });

      document.getElementById('previous').addEventListener('click', () => {
        hideDetail();
        shownMonth = new Date(shownMonth.getFullYear(), shownMonth.getMonth() - 1, 1);
        render();
        loadEvents();
      });

      document.getElementById('next').addEventListener('click', () => {
        hideDetail();
        shownMonth = new Date(shownMonth.getFullYear(), shownMonth.getMonth() + 1, 1);
        render();
        loadEvents();
      });

      document.getElementById('today').addEventListener('click', () => {
        hideDetail();
        shownMonth = new Date(today.getFullYear(), today.getMonth(), 1);
        selected = new Date(today);
        render();
        loadEvents();
      });

      /*
       * Events come from scripts/calendar.ps1, which fetches the iCal feeds listed
       * in ~/.glzr/calendar-feeds.txt. With no feeds configured the script prints
       * nothing and this is a month view with the weather under it.
       */
      let icsText = null;

      async function loadEvents() {
        if (icsText === null) {
          try {
            const result = await zebar.shellExec('powershell.exe', [
              '-NoProfile',
              '-ExecutionPolicy',
              'Bypass',
              '-File',
              calendarScript,
            ]);

            icsText = result.stdout || '';
          } catch (error) {
            console.warn('calendar feed unavailable:', error);
            icsText = '';
          }
        }

        if (!icsText) return;

        // A month either side of the one on screen, so an event that starts in the
        // previous month and runs into this one still shows.
        const from = new Date(shownMonth.getFullYear(), shownMonth.getMonth() - 1, 1);
        const to = new Date(shownMonth.getFullYear(), shownMonth.getMonth() + 2, 0);

        try {
          events = parseIcs(icsText, from, to);
        } catch (error) {
          console.warn('calendar could not be read:', error);
          events = [];
        }

        render();
      }

      async function loadWeather() {
        try {
          const coords = await resolveCoords();

          if (!coords) return;

          forecast = await fetchWeather(coords);
          renderWeather();
        } catch (error) {
          // The calendar is the point of this panel; weather is decoration.
          console.warn('forecast unavailable:', error);
        }
      }

      renderWeekdays();
      render();
      loadEvents();
      loadWeather();

      /*
       * Redrawn every half minute: what counts as past, happening and still to come
       * moves on its own, and so does the countdown on the warning.
       */
      const ticking = setInterval(() => {
        renderUpNext();
        renderDay();
      }, 30000);

      window.addEventListener('beforeunload', () => clearInterval(ticking));

      /* Closing is done from outside, by the helper the bar starts when it opens
         this panel (see window-ctl.ps1). Escape here is a bonus, and closes the
         details first when they are open, which is what Escape usually means. */
      function close() {
        const panel = document.querySelector('.panel');

        if (!panel || panel.classList.contains('closing')) {
          widget.close();
          return;
        }

        panel.classList.add('closing');
        setTimeout(() => widget.close(), 130);
      }

      window.addEventListener('keydown', event => {
        if (event.key !== 'Escape') return;

        if (detailOpen()) {
          hideDetail();
          return;
        }

        close();
      });
    </script>
  </body>
</html>
