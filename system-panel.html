<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      styles.css @imports the icon font stylesheet, which in turn asks for the
      woff2: three requests discovered one after another, with the icon glyphs
      not drawn until the last one lands. Preloading starts all three at once.
    -->
    <link rel="preload" href="./assets/icons.css" as="style" />
    <link rel="preload" href="./assets/nerdfont.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <!--
      The zebar client module and its dependencies are vendored (assets/vendor),
      for the same reason the icon font is: a panel is a fresh webview every time
      it opens, and importing the module graph from a CDN put three round trips
      in front of the first paint. Preloading them here starts all seven files at
      once instead of discovering each one after the previous has parsed.
    -->
    <link rel="modulepreload" href="./assets/vendor/zebar.js" />
    <link rel="modulepreload" href="./assets/vendor/zod.js" />
    <link rel="modulepreload" href="./assets/vendor/luxon.js" />
    <link rel="modulepreload" href="./assets/vendor/tauri-core.js" />
    <link rel="modulepreload" href="./assets/vendor/tauri-event.js" />
    <link rel="modulepreload" href="./assets/vendor/tauri-window.js" />
    <link rel="modulepreload" href="./assets/vendor/glazewm.js" />
  </head>
  <body class="panel-body">
    <div class="panel system-panel">
      <div class="panel-header">
        <i class="nf nf-md-chip"></i>
        <span class="panel-title">System</span>
        <span class="panel-place" id="hostname"></span>
      </div>

      <div class="system-block">
        <div class="system-line">
          <span class="system-label">CPU</span>
          <span class="system-value" id="cpu-value">--</span>
        </div>
        <div class="level-track">
          <div class="level-fill" id="cpu-fill"></div>
        </div>
      </div>

      <div class="system-block">
        <div class="system-line">
          <span class="system-label">Memory</span>
          <span class="system-value" id="memory-value">--</span>
        </div>
        <div class="level-track">
          <div class="level-fill" id="memory-fill"></div>
        </div>
      </div>

      <div class="panel-separator"></div>

      <div class="panel-rows" id="rows"></div>
    </div>

    <script type="module">
      import * as zebar from './assets/vendor/zebar.js';

      const widget = zebar.currentWidget();



      const cpu = zebar.createProvider({ type: 'cpu', refreshInterval: 1500 });
      const memory = zebar.createProvider({
        type: 'memory',
        refreshInterval: 1500,
      });
      const host = zebar.createProvider({ type: 'host', refreshInterval: 60000 });

      const el = {
        hostname: document.getElementById('hostname'),
        cpuValue: document.getElementById('cpu-value'),
        cpuFill: document.getElementById('cpu-fill'),
        memoryValue: document.getElementById('memory-value'),
        memoryFill: document.getElementById('memory-fill'),
        rows: document.getElementById('rows'),
      };

      let cpuOutput = null;
      let memoryOutput = null;
      let hostOutput = null;

      function bytesToGb(bytes) {
        return bytes / 1024 / 1024 / 1024;
      }

      function gb(bytes) {
        const value = bytesToGb(bytes);

        if (value < 10) return value.toFixed(1) + ' GB';
        return Math.round(value) + ' GB';
      }

      function humanDuration(seconds) {
        const minutes = Math.floor(seconds / 60);
        const hours = Math.floor(minutes / 60);
        const days = Math.floor(hours / 24);

        if (days > 0) return days + ' d ' + (hours % 24) + ' h';
        if (hours > 0) return hours + ' h ' + String(minutes % 60).padStart(2, '0') + ' min';
        return minutes + ' min';
      }

      // Green up to 70%, amber to 90%, red past that.
      function loadState(percent) {
        if (percent >= 90) return 'high';
        if (percent >= 70) return 'warn';
        return 'ok';
      }

      function row(icon, label, value) {
        if (value === null || value === undefined || value === '') return '';

        return (
          '<div class="panel-row">' +
          '<i class="nf ' + icon + '"></i>' +
          '<span class="row-label">' + label + '</span>' +
          '<span class="row-value">' + value + '</span>' +
          '</div>'
        );
      }

      function render() {
        if (cpuOutput) {
          const usage = Math.round(cpuOutput.usage);

          el.cpuValue.textContent =
            usage +
            '%' +
            (cpuOutput.frequency ? '  ·  ' + (cpuOutput.frequency / 1000).toFixed(1) + ' GHz' : '');
          el.cpuFill.style.width = Math.max(0, Math.min(100, usage)) + '%';
          el.cpuFill.dataset.state = loadState(usage);
        }

        if (memoryOutput) {
          const usage = Math.round(memoryOutput.usage);

          el.memoryValue.textContent =
            gb(memoryOutput.usedMemory) +
            ' / ' +
            gb(memoryOutput.totalMemory) +
            '  ·  ' +
            usage +
            '%';
          el.memoryFill.style.width = Math.max(0, Math.min(100, usage)) + '%';
          el.memoryFill.dataset.state = loadState(usage);
        }

        if (hostOutput && hostOutput.hostname) {
          el.hostname.textContent = hostOutput.hostname;
        }

        el.rows.innerHTML = [
          row(
            'nf-md-memory',
            'Cores',
            cpuOutput
              ? cpuOutput.logicalCoreCount +
                ' logical' +
                (cpuOutput.physicalCoreCount
                  ? ' / ' + cpuOutput.physicalCoreCount + ' physical'
                  : '')
              : null,
          ),
          row(
            'nf-md-swap_horizontal',
            'Swap',
            memoryOutput && memoryOutput.totalSwap > 0
              ? gb(memoryOutput.usedSwap) + ' / ' + gb(memoryOutput.totalSwap)
              : null,
          ),
          row(
            'nf-md-timer_outline',
            'Uptime',
            hostOutput && hostOutput.uptime
              ? humanDuration(hostOutput.uptime)
              : null,
          ),
          row('nf-md-chip', 'Vendor', cpuOutput ? cpuOutput.vendor : null),
        ].join('');
      }

      cpu.onOutput(output => {
        cpuOutput = output;
        render();
      });

      memory.onOutput(output => {
        memoryOutput = output;
        render();
      });

      host.onOutput(output => {
        hostOutput = output;
        render();
      });

      render();

      /* Closing is done from outside, by the helper the bar starts when it opens
         this panel (see window-ctl.ps1). Escape here is a bonus. */
      // Animate out first, then close: the window is transparent, so a short
      // fade and lift is visible before it disappears.
      function close() {
        const panel = document.querySelector('.panel');

        if (!panel || panel.classList.contains('closing')) {
          widget.close();
          return;
        }

        panel.classList.add('closing');
        setTimeout(() => widget.close(), 130);
      }

      window.addEventListener('keydown', event => {
        if (event.key === 'Escape') close();
      });

      /*
       * The card no longer fills its window, so there is a transparent strip
       * below it that belongs to this panel. A click there used to dismiss,
       * because it landed outside the window; now it lands inside one. Treat it
       * as what it looks like: a click outside the card.
       */
      window.addEventListener('mousedown', event => {
        if (!event.target.closest('.panel')) close();
      });
    </script>
  </body>
</html>
